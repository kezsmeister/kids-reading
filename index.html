<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Reading Garden</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#fff3d6">
<style>
:root{--bg:#fff3d6;--ink:#3b2f63;--pink:#ff86b9;--blue:#5cc6ff;--green:#5fd68a;--yellow:#ffd23f;--orange:#ff9f43;--purple:#a98bff;--red:#ff5a5f;
  --btn:clamp(66px,15vmin,112px)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:"Baloo 2","Nunito","Trebuchet MS","Arial Rounded MT Bold","Comic Sans MS",system-ui,sans-serif;font-weight:700;touch-action:manipulation}
button{font:inherit;color:inherit;border:0;cursor:pointer;touch-action:manipulation}
#app{position:fixed;inset:0;background:radial-gradient(circle at 10% 8%,#ffe9a8 0 9%,transparent 9.2%),radial-gradient(circle at 92% 92%,#cdf3ff 0 14%,transparent 14.2%),radial-gradient(circle at 95% 10%,#ffd6ea 0 7%,transparent 7.2%),var(--bg)}
.screen{position:absolute;inset:0;display:none;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
.screen.on{display:flex;animation:fadein .25s ease}
@keyframes fadein{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:none}}
.rbtn{width:clamp(48px,10vmin,72px);height:clamp(48px,10vmin,72px);border-radius:50%;background:#fff;box-shadow:0 5px 0 #d9ccb0,0 8px 14px #0002;font-size:clamp(24px,5vmin,36px);display:flex;align-items:center;justify-content:center;flex:none}
.rbtn:active{transform:translateY(4px);box-shadow:0 1px 0 #d9ccb0}
.rbtn.off{opacity:.5;filter:grayscale(.7)}
.bigbtn{background:var(--green);color:#fff;border-radius:999px;padding:.35em 1.1em;font-size:clamp(28px,6vmin,46px);box-shadow:0 7px 0 #38a862,0 10px 18px #0003;text-shadow:0 2px 0 #0002;display:inline-flex;align-items:center;gap:.4em}
.bigbtn:active{transform:translateY(5px);box-shadow:0 2px 0 #38a862}
.bigbtn.blue{background:var(--blue);box-shadow:0 7px 0 #2f97cc,0 10px 18px #0003}
.bigbtn.orange{background:var(--orange);box-shadow:0 7px 0 #cc7a26,0 10px 18px #0003}
.bigbtn.gray{background:#b9b0c9;box-shadow:0 7px 0 #8d84a0}
#home{padding-left:max(14px,env(safe-area-inset-left));padding-right:max(14px,env(safe-area-inset-right))}
.hhead{display:flex;align-items:center;gap:10px;padding:12px 4px 6px;flex-wrap:wrap}
.logo{font-size:clamp(26px,6.2vmin,50px);font-weight:900;flex:1;min-width:190px;line-height:1;text-shadow:0 3px 0 #fff}
.logo span{display:inline-block;animation:sway 3s ease-in-out infinite}
@keyframes sway{50%{transform:rotate(12deg) scale(1.1)}}
.starbadge{background:#fff;border-radius:999px;padding:.2em .7em;font-size:clamp(20px,4.6vmin,34px);box-shadow:0 4px 0 #ecdcb4;display:flex;gap:.3em;align-items:center}
.toggles{display:flex;gap:8px}
.mysounds{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;align-items:center;padding:2px 4px 8px;font-size:clamp(17px,3.6vmin,26px)}
.mysounds i{font-style:normal;background:#fff;border-radius:12px;padding:0 .4em;box-shadow:0 3px 0 #ecdcb4}
.mysounds i.new{background:#fff0a8}
.cards{flex:1;overflow:auto;display:grid;grid-template-columns:repeat(auto-fit,minmax(min(42vw,210px),1fr));gap:clamp(10px,2.4vmin,20px);padding:10px 4px 110px;align-content:start}
.card{position:relative;border-radius:28px;padding:12px 8px 10px;background:var(--c);color:#fff;text-shadow:0 2px 0 #0003;box-shadow:0 8px 0 var(--d),0 12px 18px #0002;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:clamp(112px,22vmin,180px)}
.card:active{transform:translateY(6px);box-shadow:0 2px 0 var(--d)}
.card .ic{font-size:clamp(42px,10vmin,80px);line-height:1.1;filter:drop-shadow(0 3px 0 #0002)}
.card .nm{font-size:clamp(19px,4.2vmin,30px);font-weight:900;line-height:1.05;text-align:center}
.card .lv{display:flex;gap:5px;margin-top:4px}
.card.locked{filter:grayscale(.8);opacity:.6}
.card.locked .lockn{font-size:14px;text-shadow:none}
.card.place{grid-column:1/-1;min-height:90px;flex-direction:row;gap:14px}
.lvd{display:inline-block;width:clamp(10px,2vmin,15px);height:clamp(10px,2vmin,15px);border-radius:50%;background:#fff5;border:2px solid #fff9}
.lvd.on{background:#fff;border-color:#fff}
.bottombar{position:absolute;left:0;right:0;bottom:0;display:flex;justify-content:space-between;align-items:flex-end;padding:10px 14px calc(10px + env(safe-area-inset-bottom));pointer-events:none}
.bottombar>*{pointer-events:auto}
.stickerbtn{background:var(--pink);color:#fff;border-radius:999px;padding:.25em .9em;font-size:clamp(22px,5vmin,38px);box-shadow:0 6px 0 #d2508a,0 10px 16px #0002;display:flex;gap:.3em;align-items:center}
.parentwrap{display:flex;flex-direction:column;align-items:center;font-size:12px;opacity:.75}
#parentBtn{--p:0deg;width:clamp(48px,9vmin,64px);height:clamp(48px,9vmin,64px);border-radius:50%;background:conic-gradient(var(--purple) var(--p),#e4dcf5 0);position:relative;font-size:26px;display:flex;align-items:center;justify-content:center}
#parentBtn::before{content:"";position:absolute;inset:6px;background:#fff;border-radius:50%}
#parentBtn span{position:relative}
.top{display:flex;align-items:center;gap:10px;padding:10px 14px 4px}
.progress{flex:1;display:flex;justify-content:center;align-items:center;gap:clamp(4px,1vmin,9px);flex-wrap:wrap;min-height:30px}
.pd{width:clamp(16px,3.6vmin,26px);height:clamp(16px,3.6vmin,26px);border-radius:50%;background:#eadfc6;display:flex;align-items:center;justify-content:center;font-size:clamp(14px,3.2vmin,22px);line-height:1}
.pd.cur{background:var(--orange);transform:scale(1.3);animation:pulse 1.2s infinite}
.pd.done{background:none}
.lvpill{display:flex;gap:4px;padding:6px 10px;background:#fff;border-radius:999px;box-shadow:0 3px 0 #ecdcb4}
.lvpill .lvd,.ptable .lvd{border-color:#d3c6ea;background:#fff}.lvpill .lvd.on,.ptable .lvd.on{background:var(--purple);border-color:var(--purple)}
.promptbar{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:4px 14px;text-align:center;min-height:clamp(50px,10vmin,84px)}
#prompt{font-size:clamp(20px,5vmin,40px);font-weight:900;line-height:1.15}
#prompt b{color:#7a5cff}
#ruline{font-size:clamp(14px,3.4vmin,22px);font-weight:700;color:#8a7aa8;line-height:1.15;margin-top:2px}
#ruline:empty{display:none}
.stageOuter{flex:1;overflow:auto;display:flex;padding:4px 12px;min-height:0}
#stage{margin:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(18px,3.4vh,30px);max-width:100%;padding:16px 0 10px}
.fb{min-height:clamp(70px,13vmin,110px);display:flex;align-items:center;justify-content:center;gap:16px;padding:6px 14px calc(8px + env(safe-area-inset-bottom));text-align:center}
.fbtext{font-size:clamp(20px,4.8vmin,38px);font-weight:900;display:flex;gap:.5em;align-items:center;flex-wrap:wrap;justify-content:center}
.fbtext .praise{color:#2fae63}.fbtext .oops{color:#e07a10}
.fbtext .note{background:#fff;border-radius:18px;padding:.1em .6em;box-shadow:0 4px 0 #ecdcb4;color:var(--ink)}
.fbtext small{display:block;font-size:.6em;color:#8a7aa8}
#nextBtn{display:none;flex:none;width:clamp(64px,13vmin,100px);height:clamp(64px,13vmin,100px);border-radius:50%;background:var(--green);color:#fff;font-size:clamp(36px,8vmin,58px);box-shadow:0 7px 0 #38a862,0 10px 16px #0003;align-items:center;justify-content:center;animation:pulse 1s infinite}
#nextBtn.show{display:flex}
@keyframes pulse{50%{transform:scale(1.1)}}
/* question card: look, don't press */
.qcard,.atray{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(8px,2vmin,18px);max-width:100%;border-radius:30px}
.qcard{background:#fffef9;border:4px solid #ffdca0;box-shadow:0 6px 16px #a9823c22;padding:clamp(18px,3.4vmin,28px) clamp(14px,3vmin,26px) clamp(12px,2.4vmin,20px);cursor:default;min-width:min(60vw,240px)}
.qcard::before{content:"🤔";position:absolute;left:14px;top:-19px;width:38px;height:38px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:22px;line-height:1;box-shadow:0 3px 0 #0002;background:#ffe7ad;border:3px solid #ffdca0}
.atray{background:#e9e3ff;border:4px solid #c9bdff;box-shadow:inset 0 5px 0 #d6ccff,0 6px 0 #b5a6f5;padding:clamp(12px,2.6vmin,22px) clamp(10px,2.4vmin,22px)}
.qcard.empty,.atray.empty{display:none}
.qrow{display:flex;align-items:center;justify-content:center;gap:clamp(10px,3vmin,24px);flex-wrap:wrap}
.bigpic{font-size:clamp(64px,17vmin,130px);line-height:1.05}
.bigl{font-size:clamp(76px,20vmin,150px);line-height:1;font-weight:900;color:#5a4d86;min-width:1em;text-align:center}
.tiles{display:flex;gap:clamp(6px,1.6vmin,12px);justify-content:center}
.tile{min-width:clamp(54px,13vmin,96px);height:clamp(64px,15vmin,110px);padding:0 .15em;border-radius:18px;background:#f4f1fb;border:3px solid #d9d0ef;color:#5a4d86;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vmin,74px);font-weight:900;transition:background .2s,transform .2s}
.tile.lit{background:#fff3b0;border-color:#ffd23f;transform:scale(1.12)}
.tile.blank{background:#fff;border:4px dashed #a996ee;color:#a996ee}
.tile.filled{background:#dff7e8;border:3px solid #7fd6a2;color:#1d7a46;animation:hop .5s}
.bigword{font-size:clamp(56px,15vmin,116px);font-weight:900;color:#5a4d86;letter-spacing:.04em;line-height:1.05}
.sent{font-size:clamp(30px,7.4vmin,60px);font-weight:900;color:#5a4d86;text-align:center;line-height:1.25;max-width:86vw}
.sent .rd{display:inline-block;padding:0 .08em;border-radius:10px}
.sent .rd.lit{background:#fff3b0}
.tag{font-size:clamp(14px,3vmin,20px);background:#eef6ff;border:2px solid #bfe0ff;color:#3b7ddd;border-radius:999px;padding:.1em .7em}
.rutag{font-size:clamp(13px,2.8vmin,18px);color:#a0526e;background:#fff0f5;border:2px solid #ffc6da;border-radius:999px;padding:.1em .7em}
.qcard .cbtn{min-width:0;width:clamp(56px,11vmin,80px);height:clamp(56px,11vmin,80px);border-radius:50%;background:#fff;color:#3b7ddd;border:4px solid #8fd3ff;box-shadow:0 4px 0 #bfe6ff;font-size:clamp(24px,5vmin,36px);display:inline-flex;align-items:center;justify-content:center;cursor:pointer}
.qcard .cbtn:active{transform:translateY(3px);box-shadow:0 1px 0 #bfe6ff}
/* answers: one chunky purple family */
.choices{display:flex;gap:clamp(10px,2.6vmin,22px);flex-wrap:wrap;justify-content:center;max-width:min(92vw,560px)}
.numbtn{--c:#7a5cff;--d:#4a2fc4;min-width:var(--btn);height:var(--btn);border-radius:26px;font-size:clamp(38px,9vmin,66px);font-weight:900;color:#fff;text-shadow:0 3px 0 #0003;
  background:var(--c);box-shadow:0 9px 0 var(--d),0 14px 16px #3b1fa033;transition:transform .1s,opacity .2s;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0 .3em;position:relative;line-height:1}
.numbtn:active{transform:translateY(7px);box-shadow:0 2px 0 var(--d)}
.numbtn.right{--c:#2fc27a;--d:#1b8f57;animation:hop .6s ease}
.numbtn.soft{opacity:.25;transform:scale(.88);pointer-events:none}
.numbtn.glow{animation:glow 1s ease-in-out infinite}
@keyframes glow{50%{box-shadow:0 0 0 10px #ffd23fcc,0 8px 0 var(--d);transform:scale(1.1)}}
@keyframes hop{30%{transform:translateY(-18px) scale(1.15)}60%{transform:translateY(0) scale(.95)}}
.numbtn .pic{font-size:clamp(40px,10vmin,70px);text-shadow:none;filter:drop-shadow(0 2px 0 #0003)}
.numbtn.pb{width:calc(var(--btn)*1.12);height:calc(var(--btn)*1.12)}
.numbtn.pb.lab{height:calc(var(--btn)*1.3)}
.numbtn .lbl{font-size:clamp(16px,3.6vmin,26px);margin-top:4px}
.numbtn.wd{font-size:clamp(30px,7vmin,52px);padding:0 .55em}
.numbtn.scene{padding:0 .4em;min-width:calc(var(--btn)*1.5)}
.numbtn.scene .pic{font-size:clamp(34px,8vmin,58px);letter-spacing:.05em}
.center{flex:1;overflow:auto;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:clamp(10px,2.6vmin,26px);padding:14px;text-align:center}
.bigtitle{font-size:clamp(30px,8vmin,62px);font-weight:900}
.starsrow{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;font-size:clamp(30px,8vmin,60px)}
.starsrow span{animation:pop .4s backwards}
@keyframes pop{from{transform:scale(0)}to{transform:scale(1)}}
.stkbig{font-size:clamp(84px,22vmin,160px);line-height:1;animation:bounceIn 1s;filter:drop-shadow(0 8px 0 #0002)}
@keyframes bounceIn{0%{transform:scale(0) rotate(-40deg)}60%{transform:scale(1.3) rotate(10deg)}100%{transform:scale(1)}}
.row{display:flex;align-items:center;justify-content:center;gap:clamp(8px,2vmin,20px);flex-wrap:wrap}
.stkgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(clamp(76px,17vmin,130px),1fr));gap:12px;padding:8px 16px 20px;overflow:auto;flex:1;align-content:start}
.stk{aspect-ratio:1;background:#fff;border-radius:24px;display:flex;align-items:center;justify-content:center;font-size:clamp(40px,10vmin,78px);box-shadow:0 5px 0 #e7d9b8}
.stk.lock{background:#efe6d0;filter:grayscale(1) brightness(.4);opacity:.35}
.hdr{display:flex;align-items:center;gap:12px;padding:12px 14px}
.hdr h1{margin:0;font-size:clamp(22px,5vmin,38px);flex:1}
.parbody{overflow:auto;padding:0 16px 30px;flex:1;font-size:clamp(15px,2.6vmin,19px)}
.ptable{width:100%;border-collapse:collapse;background:#fff;border-radius:18px;overflow:hidden;box-shadow:0 4px 0 #e7d9b8}
.ptable th,.ptable td{padding:7px 9px;text-align:left;border-bottom:2px solid #f2ead8;vertical-align:middle}
.ptable th{background:#efe7ff;font-size:.85em}
.bar2{height:12px;background:#eee;border-radius:6px;overflow:hidden;min-width:60px}.bar2>i{display:block;height:100%;background:var(--green)}
.pset{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:14px 0}
.modebtn{font-size:clamp(16px,3vmin,22px);padding:.2em .8em;border-radius:999px;background:#fff;box-shadow:0 5px 0 #d9ccb0;opacity:.8}
.modebtn.on{background:var(--purple);color:#fff;opacity:1;box-shadow:0 5px 0 #7a5fd6}
.vlist{max-height:clamp(150px,30vh,260px);overflow:auto;background:#fff;border-radius:16px;padding:6px;box-shadow:0 4px 0 #e7d9b8;width:100%}
.vrow{display:flex;gap:8px;align-items:center;justify-content:space-between;padding:4px;border-bottom:2px solid #f2ead8}
.vrow.on{background:#eefbe9;border-radius:12px}
.vsel,.vplay{font:inherit;font-weight:800;border-radius:14px;padding:8px 12px;min-height:44px;background:#f4f1fb;border:2px solid #d9d0ef;color:var(--ink);text-align:left}
.vsel{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis}
.vsel small{opacity:.6;font-weight:700}
.vplay{background:#7a5cff;border-color:#4a2fc4;color:#fff;white-space:nowrap}
.vpick{flex-direction:column;align-items:stretch}
.small-note{font-size:.85em;opacity:.75;margin:6px 0;font-weight:600}
.toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:var(--purple);color:#fff;padding:.4em 1.2em;border-radius:999px;font-size:clamp(22px,6vmin,42px);font-weight:900;z-index:100;box-shadow:0 8px 18px #0004;animation:toast 2.6s forwards;pointer-events:none;white-space:nowrap}
@keyframes toast{0%{transform:translate(-50%,-30px);opacity:0}15%,80%{transform:translate(-50%,0);opacity:1}100%{opacity:0}}
#fx{position:fixed;inset:0;pointer-events:none;z-index:90;overflow:hidden}
.confetti{position:absolute;font-size:clamp(22px,5vmin,40px)}
/* landscape phones */
@media (max-height:560px){
  :root{--btn:clamp(58px,18vmin,84px)}
  .top{padding:4px 12px 0}
  .rbtn{width:46px;height:46px;font-size:24px}
  .promptbar{min-height:40px;padding:2px 12px}
  #prompt{font-size:clamp(18px,5vmin,28px)}
  #ruline{font-size:14px;margin-top:0}
  .fb{min-height:50px;padding-top:2px;padding-bottom:4px}
  #nextBtn{width:54px;height:54px;font-size:32px}
  .fbtext{font-size:22px}
  #stage{flex-direction:row;flex-wrap:wrap;gap:22px;padding:16px 0 8px}
  .qcard,.atray{border-radius:22px;border-width:3px;gap:8px}
  .qcard{padding:14px 12px 10px;min-width:0}.atray{padding:10px}
  .qcard::before{width:30px;height:30px;font-size:17px;top:-15px;left:10px}
  .numbtn{box-shadow:0 6px 0 var(--d);border-radius:20px;font-size:clamp(30px,8vmin,46px)}
  .numbtn .pic{font-size:clamp(34px,11vmin,52px)}
  .numbtn .lbl{font-size:16px;margin-top:2px}
  .numbtn.wd{font-size:clamp(26px,7vmin,38px)}
  .numbtn.scene .pic{font-size:clamp(28px,7.4vmin,40px)}
  .choices{gap:12px;max-width:min(52vw,420px)}
  .bigpic{font-size:clamp(56px,20vmin,92px)}
  .bigl{font-size:clamp(64px,24vmin,110px)}
  .tile{min-width:56px;height:70px;font-size:48px;border-radius:14px}
  .bigword{font-size:clamp(48px,18vmin,84px)}
  .sent{font-size:clamp(26px,7vmin,40px);max-width:44vw}
  .card{min-height:96px}
  .cards{padding-bottom:90px}
}
@media (max-height:420px){
  #stage{gap:18px;padding-top:14px}
  .qcard .cbtn{width:48px;height:48px;font-size:22px}
}
@media (max-width:520px) and (min-height:700px){
  :root{--btn:min(23vw,100px)}
  .tile{min-width:64px;height:82px;font-size:56px}
  .bigpic{font-size:104px}.bigl{font-size:130px}.bigword{font-size:84px}.sent{font-size:40px}
  .numbtn .pic{font-size:54px}.numbtn.wd{font-size:40px}.numbtn.scene .pic{font-size:44px}
  .numbtn{font-size:54px}
  #stage{gap:34px}
}
</style>
</head>
<body>
<div id="app">
  <section id="home" class="screen on">
    <div class="hhead">
      <div class="logo"><span>📚</span> Reading Garden</div>
      <div class="starbadge">⭐ <span id="starCount">0</span></div>
      <div class="toggles">
        <button class="rbtn" id="tSound" aria-label="Sound effects">🔔</button>
        <button class="rbtn" id="tVoice" aria-label="Read aloud">🗣️</button>
      </div>
    </div>
    <div class="mysounds" id="mySounds"></div>
    <div class="cards" id="cards"></div>
    <div class="bottombar">
      <div class="parentwrap"><button id="parentBtn" aria-label="Parent corner - hold 3 seconds"><span>👪</span></button><div>hold 3 sec</div></div>
      <button class="stickerbtn" id="stkBtn">🎁 <span id="stkCount">0</span>/<span id="stkTotal">24</span></button>
    </div>
  </section>
  <section id="act" class="screen">
    <div class="top">
      <button class="rbtn" id="homeBtn" aria-label="Home">🏠</button>
      <div class="progress" id="progress"></div>
      <div class="lvpill" id="lvpill"></div>
      <button class="rbtn" id="replayBtn" aria-label="Say it again">🔊</button>
    </div>
    <div class="promptbar"><div id="prompt"></div><div id="ruline"></div></div>
    <div class="stageOuter"><div id="stage"></div></div>
    <div class="fb"><div class="fbtext" id="fbtext"></div><button id="nextBtn" aria-label="Next">➜</button></div>
  </section>
  <section id="res" class="screen"><div class="center" id="resBody"></div></section>
  <section id="stk" class="screen">
    <div class="hdr"><button class="rbtn" id="stkBack">🏠</button><h1>My Stickers 🎁</h1><div class="starbadge">⭐ <span id="starCount2">0</span></div></div>
    <div class="stkgrid" id="stkGrid"></div>
  </section>
  <section id="par" class="screen">
    <div class="hdr"><button class="rbtn" id="parBack">✖</button><h1>👪 Parent corner</h1></div>
    <div class="parbody" id="parBody"></div>

  if(R.idx>=R.total)return finishRound();
  const st=$('#stage');st.innerHTML='';st.className='';st.dataset.act=R.id;
  $('#prompt').innerHTML='';$('#ruline').textContent='';$('#fbtext').innerHTML='';$('#nextBtn').classList.remove('show');
  R.q={tries:0,done:false,hint:null,glow:null,note:'',nsay:[],speech:[],stim:[],tag:0};
  drawProgress();
  const c={lvl:sk(R.key).lvl,idx:R.idx};
  try{R.a.make(c,st);organize(st)}catch(e){console.error('question error',e);R.marks[R.idx]=1;R.idx++;setTimeout(()=>{if(R)nextQ()},50)}
}
/* calm QUESTION CARD (look) + bright ANSWER TRAY (press) */
function organize(st){
  const kids=[...st.children];const card=el('div','qcard'),tray=el('div','atray');
  kids.forEach(k=>(k.matches('.choices')?tray:card).appendChild(k));
  if(!card.children.length)card.classList.add('empty');if(!tray.children.length)tray.classList.add('empty');
  st.append(card,tray);
}
/* English instruction (+ short Russian line) then the stimulus */
ctl.ask=(en,ru,stim)=>{
  $('#prompt').innerHTML=en;$('#ruline').textContent=S.ru&&ru?ru:'';
  const plain=en.replace(/<[^>]+>/g,'');
  R.q.speech=[plain,ru?{t:ru,ru:true}:null,...(stim||[])];R.q.stim=stim||[];
  later(()=>say(R.q.speech),250);
};
ctl.note=(n,s)=>{R.q.note=n||'';R.q.nsay=s||[]};
const PRAISE=[['Great job!','Молодец!'],['Wonderful!','Чудесно!'],['You did it!','Получилось!'],['Lovely!','Умница!'],['That is right!','Правильно!'],['Super!','Супер!']];
ctl.correct=()=>{
  const q=R.q;if(q.done)return;q.done=true;const first=q.tries===0;
  if(first){R.ok++;if(!R.a.place)S.stars++}
  R.log.push({tag:q.tag,first});
  if(!R.a.place)recSkill(first);
  R.marks[R.idx]=first?2:1;sfx.ok();burst();
  const pr=pick(PRAISE);
  $('#fbtext').innerHTML=`<span class="praise">${pr[0]}${S.ru?`<small>${pr[1]}</small>`:''}</span>${q.note?`<span class="note">${q.note}</span>`:''}`;
  say([pr[0],...q.nsay]);
  if(R.a.place){later(advance,1600);return}
  finishQ();
};
ctl.wrong=()=>{
  const q=R.q;if(q.done)return;q.tries++;
  if(R.a.place){q.done=true;R.marks[R.idx]=1;R.log.push({tag:q.tag,first:false});later(advance,700);return}
  if(q.tries===1){
    recSkill(false);sfx.oops();
    $('#fbtext').innerHTML=`<span class="oops">Let’s listen again 💛${S.ru?'<small>Давай послушаем ещё раз</small>':''}</span>`;
    if(q.hint)later(q.hint,150);else later(()=>say(['Let us listen again.',...q.stim]),150);
  }else{
    q.done=true;R.marks[R.idx]=1;sfx.oops();if(q.glow)q.glow();
    $('#fbtext').innerHTML=`<span class="oops">Here it is!</span>${q.note?`<span class="note">${q.note}</span>`:''}`;
    say(['That is okay. Here it is.',...q.nsay]);finishQ();
  }
};
function finishQ(){$('#nextBtn').classList.add('show');const tk=R.token;R.timer=setTimeout(()=>{if(R&&R.token===tk)advance()},8000)}
function advance(){if(!R)return;R.idx++;nextQ()}
/* adaptive levels per activity (3 first-try in a row: harder; 2 misses: easier) + sound-group progression */
function recSkill(first){
  const s=sk(R.key);
  if(first){s.att++;s.ok++;s.streak++;s.miss=0;if(s.streak>=3&&s.lvl<3){s.lvl++;s.streak=0;toast('Level up! 🚀');sfx.up()}}
  else{if(R.q.tries<=1)s.att++;s.miss++;s.streak=0;if(s.miss>=2&&s.lvl>1){s.lvl--;s.miss=0}}
  /* newest group unlocks the next: 10 first-try answers on items using the new sounds, at >=70% */
  if(R.q.tag===S.U&&S.U<SETS.length&&R.q.tries<=1){
    S.newAtt++;if(first)S.newOk++;
    if(S.newOk>=10&&S.newOk/S.newAtt>=.7){S.U++;S.newOk=0;S.newAtt=0;const u=S.U;setTimeout(()=>{toast('New sounds! '+SETS[u-1].join(' '));sfx.up()},900)}
  }
  save();
}
function toast(t){const d=el('div','toast',t);document.body.appendChild(d);setTimeout(()=>d.remove(),2700)}
function burst(){
  const fx=$('#fx');const em=['⭐','✨','🌟','💖','🎉','🌈'];
  for(let i=0;i<14;i++){
    const p=el('div','confetti',pick(em));p.style.left=(35+Math.random()*30)+'%';p.style.top=(40+Math.random()*10)+'%';fx.appendChild(p);
    const dx=(Math.random()-.5)*innerWidth*.8,dy=-(Math.random()*innerHeight*.4)-40;
    if(p.animate){const an=p.animate([{transform:'translate(0,0) scale(.4)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1.3) rotate(${rnd(-90,90)}deg)`,opacity:1,offset:.6},{transform:`translate(${dx*1.1}px,${dy+innerHeight*.5}px) scale(1)`,opacity:0}],{duration:1400+Math.random()*500,easing:'ease-out'});an.onfinish=()=>p.remove()}
    setTimeout(()=>p.remove(),2200);
  }
}
function finishRound(){
  if(R.a.place)return finishPlacement();
  const s=sk(R.key);s.rounds++;S.stars+=1;
  const left=STICKERS.filter(x=>!S.stickers.includes(x));let newSt=null;
  if(left.length){newSt=pick(left);S.stickers.push(newSt)}
  save();
  const id=R.id,stars=R.ok+1;
  let h=`<div class="bigtitle">🎉 Well done! 🎉</div><div class="starsrow">`;
  for(let i=0;i<stars;i++)h+=`<span style="animation-delay:${i*.12}s">⭐</span>`;
  h+=`</div>`;
  h+=newSt?`<div class="stkbig">${newSt}</div><div class="bigtitle" style="font-size:clamp(22px,5vmin,40px)">New sticker!</div>`:`<div class="stkbig">🏆</div>`;
  h+=`<div class="row"><button class="bigbtn" id="againBtn" aria-label="Play again">🔁</button><button class="bigbtn blue" id="resHome" aria-label="Home">🏠</button></div>`;
  $('#resBody').innerHTML=h;R.token++;R=null;
  show('res');sfx.win();burst();setTimeout(burst,500);
  say([`Well done! You earned ${W[Math.min(stars,20)]} stars.`+(newSt?' And look, a new sticker!':''),{t:'Молодец!',ru:true}]);
  $('#againBtn').onclick=()=>startRound(id);$('#resHome').onclick=goHome;
}
function goHome(){if(R){R.token++;clearTimeout(R.timer);R=null}try{speechSynthesis.cancel()}catch(e){}renderHome();show('home')}

/* ---------- widgets ---------- */
/* every piece of English reading text is a .rd with data-g = its graphemes (tests verify decodability) */
const rd=(text,g,cls='')=>`<span class="rd${cls?' '+cls:''}" data-g="${g?g.join('.'):''}" data-w="${text}">${text}</span>`;
const rdWord=w=>isTricky(w)?rd(w,null,'tricky'):rd(w,decomp(w));
function makeChoices(parent,opts,o){
  const box=el('div','choices');let correctBtn=null;
  opts.forEach(v=>{
    const b=el('button','numbtn'+(v.cls?' '+v.cls:''),v.html);b.type='button';b.dataset.k=v.k;
    if(v.right){b.dataset.correct='1';correctBtn=b}
    b.addEventListener('click',()=>{
      if(b.disabled||!R||R.q.done)return;sfx.pop();
      if(v.right){b.classList.add('right');if(o&&o.onRight)o.onRight(b);ctl.correct()}
      else{b.classList.add('soft');b.disabled=true;if(o&&o.onWrong&&!R.a.place)o.onWrong(v);ctl.wrong()}
    });
    box.appendChild(b);
  });
  parent.appendChild(box);
  R.q.glow=()=>{if(correctBtn)correctBtn.classList.add('glow');if(o&&o.onReveal)o.onReveal()};
  return box;
}
const picOpt=(x,right,label)=>({k:x.w,right,cls:'pb'+(label?' lab':''),html:`<span class="pic">${x.e}</span>${label?`<span class="lbl">${rd(x.w,x.g)}</span>`:''}`});
const gOpt=(g,right)=>({k:g,right,html:rd(g,[g])});
function playBtn(parent,fn){const b=el('button','cbtn','▶');b.type='button';b.setAttribute('aria-label','Listen');b.addEventListener('click',()=>{unlockSpeech();fn(b)});parent.appendChild(b);return b}
const nOpts=c=>c.lvl===1?3:4;
/* ~55% of items come from the newest group so new sounds get practice; no repeats within a round */
function chooseItem(list,key){
  const fresh=list.filter(x=>!R.used.includes(key(x)));const L=fresh.length?fresh:list;
  const nw=L.filter(x=>x.set===S.U);
  const it=(nw.length&&Math.random()<.55)?pick(nw):pick(L);
  R.used.push(key(it));return it;
}
const lexNow=f=>LEX.filter(x=>x.set<=S.U&&(!f||f(x)));
/* picture distractors; at higher levels prefer words that share sounds (cat / hat / cap) */
function picDistractors(ans,n,lvl){
  const pool=lexNow(x=>x.w!==ans.w&&x.e!==ans.e);
  const sc=x=>(lvl>=2?-x.g.filter(g=>ans.g.includes(g)).length*1.5:0)+Math.random()*2;
  const out=[];pool.map(x=>({x,s:sc(x)})).sort((a,b)=>a.s-b.s).forEach(({x})=>{if(out.length<n&&!out.some(y=>y.e===x.e))out.push(x)});
  return out;
}
function tilesEl(gl,blankAt){
  const t=el('div','tiles');gl.forEach((g,i)=>t.appendChild(el('div','tile'+(i===blankAt?' blank':''),i===blankAt?'?':rd(g,[g]))));return t;
}
/* tiles light up one by one while each sound is spoken, then the whole word */
function soundOut(tiles,gl,word){
  const ts=[...tiles.querySelectorAll('.tile')];
  const parts=gl.map((g,i)=>({t:sndSay(g),rate:.55,onstart:()=>{ts.forEach(x=>x.classList.remove('lit'));if(ts[i])ts[i].classList.add('lit')}}));
  parts.push({t:word,rate:.8,onstart:()=>ts.forEach(x=>x.classList.add('lit'))});
  speakQ(parts);
  later(()=>ts.forEach(x=>x.classList.remove('lit')),900*gl.length+1800);
}

/* ======================= activities ======================= */
const ACTS={};
/* 1) Sounds */
ACTS.sounds={name:'Sounds',icon:'👂',color:['#ff86b9','#d2508a'],note:'Hear a sound → find its letter; see a letter → find the picture that starts with that sound. Letter SOUNDS, not names.',
make(c,st,forceG){
  const all=unlockedG();
  const inits=all.filter(g=>G[g][3]);
  const mode=forceG?'hear':((inits.length>=3&&Math.random()<.45)?'see':'hear');
  const g=forceG||chooseItem((mode==='see'?inits:all).map(g=>({g,set:GSET[g]})),x=>x.g).g;
  R.q.tag=GSET[g];
  const n=forceG?4:nOpts(c);
  if(mode==='hear'){
    const pool=forceG?SETS.slice(0,3).flat():all;
    const d=shuffle(pool.filter(x=>!sameSound(x,g))).slice(0,n-1);
    const row=el('div','qrow');row.appendChild(el('div','bigpic',G[g][2]));
    playBtn(row,()=>speakQ(soundSpeech(g)));st.appendChild(row);
    ctl.ask('Listen. Which letter makes this sound?','Послушай. Какая буква даёт этот звук?',soundSpeech(g));
    makeChoices(st,shuffle([gOpt(g,true),...d.map(x=>gOpt(x,false))]));
    ctl.note(`${G[g][2]} ${rd(g,[g])}`,[{t:sndSay(g),rate:.6},G[g][1]]);
  }else{
    st.appendChild(el('div','bigl',rd(g,[g])));
    const d=shuffle(inits.filter(x=>!sameSound(x,g)&&G[x][2]!==G[g][2])).slice(0,n-1);
    const stim=c.lvl===1?[{t:sndSay(g),rate:.6},{t:sndSay(g),rate:.6}]:[];
    ctl.ask('Which picture <b>starts</b> with this sound?','Какая картинка начинается с этого звука?',stim);
    const opt=x=>({k:x,right:x===g,cls:'pb',html:`<span class="pic">${G[x][2]}</span>`});
    makeChoices(st,shuffle([opt(g),...d.map(opt)]),{onWrong:v=>later(()=>say([G[v.k][1]]),100)});
    R.q.hint=()=>say([{t:sndSay(g),rate:.6},{t:sndSay(g),rate:.6},'Like '+G[g][1]]);
    ctl.note(`${G[g][2]} ${rd(g,[g])}`,[{t:sndSay(g),rate:.6},G[g][1]]);
  }
}};
/* 2) Blend */
ACTS.blend={name:'Blend',icon:'🧩',color:['#5cc6ff','#2f97cc'],note:'Letters of a decodable word are shown; ▶ sounds them out slowly (tiles light up), then says the word. Pick the picture. Level 1: 3-letter CVC words.',
make(c,st){
  let L=lexNow(x=>c.lvl===1?x.g.length===3&&x.g.every(g=>g.length===1):c.lvl===2?x.g.length<=4:true);
  if(L.length<3)L=lexNow();
  const x=chooseItem(L,y=>y.w);R.q.tag=x.set;
  const row=el('div','qrow');const t=tilesEl(x.g);row.appendChild(t);
  playBtn(row,()=>soundOut(t,x.g,x.w));st.appendChild(row);

}};
/* 3) Build a word (segmenting) */
ACTS.build={name:'Build a word',icon:'🔤',color:['#ffb340','#cc8412'],note:'Picture + spoken word; one sound is missing (level 1: first, 2: last, 3: middle short vowel). Segmenting.',
make(c,st){

/* 7) Lookalikes & tricky sounds */
ACTS.look={name:'Lookalikes',icon:'🔍',color:['#ff5a8a','#c93a68'],minU:2,note:'English vs Cyrillic lookalike letters (P/Р, H/Н, C/С, E/Е, B/В, y/у, X/Х): the trap picture is what the Russian reading would give. Plus minimal pairs for sounds that are hard for Russian speakers: man–men, bat–bet (a/e), vet–wet, van–wan (v/w), three–tree, thin–sin (th), hat–at (h), sheep–ship.',
make(c,st){
  const looks=LOOK.filter(l=>okG(l.g)).map(l=>({l,set:GSET[l.g],key:'L'+l.L}));
  const pairs=PAIRS.filter(p=>p.set<=S.U).map(p=>({p,set:p.set,key:'P'+p.a+p.b}));
  const useLook=looks.length&&(!pairs.length||Math.random()<.4);
  const it=chooseItem(useLook?looks:pairs,y=>y.key);R.q.tag=it.set;
  if(useLook){

    row.appendChild(side);st.appendChild(row);

    const neutral=shuffle(unlockedG().filter(g=>G[g][3]&&!sameSound(g,l.g)&&G[g][2]!==l.ru[1]&&G[g][2]!==l.en[1]))[0];
    const opts=[{k:'en',right:true,cls:'pb',html:`<span class="pic">${l.en[1]}</span>`},{k:'ru',right:false,cls:'pb',html:`<span class="pic">${l.ru[1]}</span>`}];
    if(c.lvl>1&&neutral)opts.push({k:'n',right:false,cls:'pb',html:`<span class="pic">${G[neutral][2]}</span>`});
    makeChoices(st,shuffle(opts),{onWrong:v=>{if(v.k==='ru')later(()=>say([l.ru[0]+'? That is the Russian sound.',{t:`Это русская ${l.cy}. Английская ${l.L} звучит иначе.`,ru:true}]),100)}});
    R.q.hint=()=>say(['In English, this letter says',{t:sndSay(l.g),rate:.6},{t:sndSay(l.g),rate:.6}]);
    ctl.note(`${rd(l.L,[l.g])} = ${l.en[1]}`,[{t:sndSay(l.g),rate:.6},l.en[0]]);
  }else{

    playBtn(row,()=>speakQ([target,{t:target,rate:.6}]));st.appendChild(row);
    ctl.ask(pics?'Listen carefully! Which one do you hear?':'Listen carefully! Which word do you hear?','Слушай внимательно! Какое слово ты слышишь?',[target,{t:target,rate:.6}]);
    const o=w=>pics?picOpt(LEXW[w],w===target,true):{k:w,right:w===target,cls:'wd',html:rd(w,decomp(w))};
    makeChoices(st,shuffle(words.map(o)),{onWrong:v=>later(()=>say([v.k+'...',target]),100)});
    R.q.hint=()=>speakQ([words[0],words[1],'Listen.',target]);
    ctl.note(`${pics?LEXW[target].e+' ':''}${rd(target,decomp(target))}`,[target]);
  }
}};
/* placement: 6 "hear sound -> letter" questions, 2 from each of groups 1-3 */
ACTS.place={name:'Quick check',place:true,total:6,
  plan:()=>[0,1,2].flatMap(i=>shuffle(SETS[i]).slice(0,2)),
  make(c,st){ACTS.sounds.make(c,st,R.plan[R.idx])}};
function finishPlacement(){
  let U=1;
  for(let s=1;s<=3;s++){const it=R.log.filter(x=>x.tag===s);if(it.length===2&&it.every(x=>x.first))U=s+1;else break}
  S.U=Math.max(S.U,Math.min(U,4));S.placed=true;S.newOk=0;S.newAtt=0;save();
  R.token++;R=null;
  $('#resBody').innerHTML=`<div class="bigtitle">🧭 All done!</div><div class="mysounds" style="font-size:clamp(26px,6vmin,44px)">${unlockedG().map(g=>`<i>${g}</i>`).join('')}</div><div class="bigtitle" style="font-size:clamp(20px,4.6vmin,34px)">Your sounds!${S.ru?'<br><small style="color:#8a7aa8">Твои звуки!</small>':''}</div><div class="row"><button class="bigbtn" id="resHome" aria-label="Home">🏠</button></div>`;
  show('res');sfx.win();burst();
  say(['Well done! Let us play.',{t:'Молодец! Давай играть.',ru:true}]);
  $('#resHome').onclick=goHome;
}

/* ======================= screens ======================= */
const ORDER=['sounds','blend','build','read','tricky','sentence','look'];
function renderHome(){
  $('#starCount').textContent=S.stars;$('#stkCount').textContent=S.stickers.length;$('#stkTotal').textContent=STICKERS.length;
  $('#tSound').classList.toggle('off',!S.sound);$('#tSound').textContent=S.sound?'🔔':'🔕';
  $('#tVoice').classList.toggle('off',!S.voice);$('#tVoice').textContent=S.voice?'🗣️':'🤐';
  $('#mySounds').innerHTML=unlockedG().map(g=>`<i class="${GSET[g]===S.U?'new':''}">${g}</i>`).join('');
  const box=$('#cards');box.innerHTML='';
  if(!S.placed){const b=el('button','card place');b.type='button';b.style.setProperty('--c','#7a5cff');b.style.setProperty('--d','#4a2fc4');b.dataset.act='place';
    b.innerHTML=`<div class="ic">🧭</div><div class="nm">Start here!${S.ru?'<br><small style="font-size:.6em">Начни здесь!</small>':''}</div>`;
    b.addEventListener('click',()=>{ac();unlockSpeech();startRound('place')});box.appendChild(b)}
  ORDER.forEach(id=>{
    const a=ACTS[id];const s=sk(id);const locked=a.minU&&S.U<a.minU;
    const b=el('button','card'+(locked?' locked':''));b.type='button';b.dataset.act=id;b.style.setProperty('--c',a.color[0]);b.style.setProperty('--d',a.color[1]);
    b.innerHTML=`<div class="ic">${locked?'🔒':a.icon}</div><div class="nm">${a.name}</div>${locked?'<div class="lockn">opens with new sounds</div>':`<div class="lv">${lvDots(s.lvl)}</div>`}`;
    b.addEventListener('click',()=>{ac();unlockSpeech();if(locked){say(['This opens soon, when you know more sounds.',{t:'Скоро откроется!',ru:true}]);return}startRound(id)});
    box.appendChild(b);
  });
}
function renderStickers(){$('#starCount2').textContent=S.stars;const g=$('#stkGrid');g.innerHTML='';STICKERS.forEach(s=>g.appendChild(el('div','stk'+(S.stickers.includes(s)?'':' lock'),s)))}
const SAMPLE='Hello! Let us read together. Sun, cat, ship.';
function refreshVoiceList(){
  const box=document.getElementById('voiceList');if(!box)return;
  const en=englishVoices().filter(v=>!isNovelty(v.name));const auto=autoVoice(englishVoices());
  const row=(label,sel,idx,sub)=>`<div class="vrow${sel?' on':''}"><button class="vsel" data-vi="${idx}" aria-label="Use ${label}">${sel?'✅':'⚪'} <b>${label}</b>${sub?` <small>${sub}</small>`:''}</button><button class="vplay" data-vp="${idx}" aria-label="Play sample">▶ Play sample</button></div>`;
  let h=row('Auto',!S.voiceName,-1,auto?'(now: '+auto.v.name+')':'');
  if(!en.length)h+='<div class="small-note">No English voices found on this device yet – the default voice is used. Try again in a moment.</div>';
  en.forEach((v,i)=>{h+=row(v.name,S.voiceName===v.name,i,v.lang.replace('_','-')+(isMaleName(v.name)?' · male':''))});
  box.innerHTML=h;
  box.querySelectorAll('.vsel').forEach(b=>b.onclick=()=>{const i=+b.dataset.vi;S.voiceName=i<0?'':en[i].name;save();pickVoice();refreshVoiceList()});
  box.querySelectorAll('.vplay').forEach(b=>b.onclick=()=>{unlockSpeech();const i=+b.dataset.vp;
    if(i<0){const a=autoVoice(englishVoices());a?speak(SAMPLE,a.v,a.female):speak(SAMPLE)}else speak(SAMPLE,en[i],prefIndex(en[i])>=0||/female/i.test(en[i].name))});
  const rn=document.getElementById('ruVoiceNote');
  if(rn){rn.innerHTML=ruVoice?`Russian voice: <b>${ruVoice.name}</b> <button class="vplay" id="ruPlay">▶ Play</button>`:'No Russian voice on this device – Russian hints are shown as text only.';
    const rp=document.getElementById('ruPlay');if(rp)rp.onclick=()=>{unlockSpeech();speakQ([{t:'Привет! Давай читать по-английски.',ru:true}])}}
}
function renderParent(){
  const rows=ORDER.map(id=>{const a=ACTS[id];const s=S.skills[id]||{lvl:1,att:0,ok:0,rounds:0};const pct=s.att?Math.round(100*s.ok/s.att):0;
    return `<tr><td><b>${a.name}</b><div class="small-note">${a.note}</div></td><td>${lvDots(s.lvl)}</td><td>${s.rounds}</td><td>${s.att?pct+'%':'–'}<div class="bar2"><i style="width:${pct}%"></i></div></td></tr>`}).join('');
  const setBtns=SETS.map((s,i)=>`<button class="modebtn${S.U===i+1?' on':''}" data-u="${i+1}">${i+1}: ${s.join(' ')}</button>`).join('');
  $('#parBody').innerHTML=`
   <p class="small-note">Systematic synthetic phonics in Jolly Phonics order, letter SOUNDS (not names). Every word and sentence uses only unlocked sounds (+ unlocked tricky words). The newest sound group unlocks the next after 10 first-try answers on items with the new sounds (≥70%). Progress is saved on this device only.</p>
   <div class="pset"><b>Sound groups unlocked: ${S.U}/${SETS.length}</b>${S.U<SETS.length?` · next group: ${S.newOk}/10 ✓`:''}</div>
   <div class="pset">${setBtns}</div>
   <div class="small-note">Tap a group to unlock up to it (or lock back). Tricky words now: ${trickyNow().join(', ')}</div>
   <div class="pset"><button class="modebtn" id="rePlace">🧭 Redo quick check</button></div>
   <table class="ptable"><tr><th>Activity</th><th>Level</th><th>Rounds</th><th>First-try</th></tr>${rows}</table>
   <div class="pset"><b>⭐ ${S.stars}</b> stars · <b>🎁 ${S.stickers.length}/${STICKERS.length}</b> stickers</div>
   <div class="pset"><span>Questions per round:</span>${[6,8,10].map(n=>`<button class="modebtn${S.perRound===n?' on':''}" data-pr="${n}">${n}</button>`).join('')}</div>
   <div class="pset"><button class="modebtn${S.sound?' on':''}" id="pSound">🔔 Sounds ${S.sound?'on':'off'}</button><button class="modebtn${S.voice?' on':''}" id="pVoice">🗣️ Voice ${S.voice?'on':'off'}</button><button class="modebtn${S.ru?' on':''}" id="pRu">🇷🇺 Russian hints ${S.ru?'on':'off'}</button></div>
   <div class="small-note" id="ruVoiceNote"></div>
   <div class="pset vpick"><b>🗣️ English voice</b><div id="voiceList" class="vlist"></div>
    <div class="small-note">On iPhone: Settings &gt; Accessibility &gt; Spoken Content &gt; Voices &gt; English &gt; download Samantha (Enhanced). For spoken Russian hints: … &gt; Voices &gt; Russian &gt; Milena.</div>
    <div class="small-note">Speech engines read single letters as their NAMES, so sounds are spoken as “sss”, “ah”, “tuh”… followed by an example word. Please model the pure sounds yourself too.</div></div>
   <div class="pset" id="resetArea"><button class="bigbtn orange" id="resetBtn" style="font-size:20px">Reset all progress</button></div>`;
  $('#parBody').querySelectorAll('[data-pr]').forEach(b=>b.onclick=()=>{S.perRound=+b.dataset.pr;save();renderParent()});
  $('#parBody').querySelectorAll('[data-u]').forEach(b=>b.onclick=()=>{S.U=+b.dataset.u;S.placed=true;S.newOk=0;S.newAtt=0;save();renderParent()});
  $('#rePlace').onclick=()=>{S.placed=false;save();goHome()};
  $('#pSound').onclick=()=>{S.sound=!S.sound;save();renderParent()};
  $('#pVoice').onclick=()=>{S.voice=!S.voice;save();renderParent()};
  $('#pRu').onclick=()=>{S.ru=!S.ru;save();renderParent()};
  refreshVoiceList();
  $('#resetBtn').onclick=()=>{
    $('#resetArea').innerHTML=`<span>Erase stars, stickers and progress?</span><button class="bigbtn orange" id="resetYes" style="font-size:20px">Yes, erase</button><button class="bigbtn gray" id="resetNo" style="font-size:20px">Cancel</button>`;
    $('#resetYes').onclick=()=>{const keep={sound:S.sound,voice:S.voice,voiceName:S.voiceName,perRound:S.perRound,ru:S.ru};S=Object.assign(DEFAULTS(),keep);save();renderParent();renderHome()};
    $('#resetNo').onclick=renderParent;
  };
}

/* ---------- wiring ---------- */
['pointerup','touchend','click'].forEach(ev=>document.addEventListener(ev,()=>{userTapped=true;ac();unlockSpeech()},{capture:true,passive:true}));
$('#tSound').onclick=()=>{S.sound=!S.sound;save();renderHome();if(S.sound)sfx.ok()};
$('#tVoice').onclick=()=>{S.voice=!S.voice;save();renderHome();if(S.voice)say(['Hello, friend! Let us read together.'])};
$('#stkBtn').onclick=()=>{renderStickers();show('stk')};
$('#stkBack').onclick=goHome;$('#parBack').onclick=goHome;$('#homeBtn').onclick=goHome;
$('#replayBtn').onclick=()=>{if(R&&R.q)speakQ(R.q.speech)};
$('#nextBtn').onclick=()=>{if(R&&R.q&&R.q.done)advance()};
document.addEventListener('contextmenu',e=>e.preventDefault());
(function(){const b=$('#parentBtn');let iv=null,t0=0;
  const stop=()=>{if(iv){clearInterval(iv);iv=null}b.style.setProperty('--p','0deg')};
  b.addEventListener('pointerdown',()=>{stop();t0=performance.now();iv=setInterval(()=>{const p=Math.min(1,(performance.now()-t0)/3000);b.style.setProperty('--p',(p*360)+'deg');if(p>=1){stop();renderParent();show('par')}},40)});
  ['pointerup','pointerleave','pointercancel'].forEach(ev=>b.addEventListener(ev,stop));
})();
renderHome();
</script>
</body>
